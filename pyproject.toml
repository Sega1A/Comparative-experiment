[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparative-experiment"
version = "0.1.0"
description = "Comparativa HTTP, MQTT y CoAP para detección de caídas"
requires-python = ">=3.11"
# Dependencias de common/ (esquemas, configuración y base de datos).
dependencies = [
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[project.optional-dependencies]
http = ["flask==3.1.3", "gunicorn>=23,<27"]
coap = ["aiocoap>=0.4.12,<0.5"]
mqtt = ["paho-mqtt>=2.0,<3"]
dev = ["pytest==9.1.1", "pytest-asyncio>=0.24,<2", "ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["common*", "servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = ["integration: necesita PostgreSQL (variable TEST_DATABASE_URL)"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
