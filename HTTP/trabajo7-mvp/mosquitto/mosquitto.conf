# Configuracion minima para el banco de pruebas.
# OJO: allow_anonymous true es SOLO para el laboratorio.
# En el informe (seccion de Seguridad) hay que decir que en produccion
# esto iria con usuario/password y TLS en el puerto 8883.

listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Desactiva el algoritmo de Nagle en el broker.
# SIN esto, la interaccion Nagle + delayed-ACK de TCP agrega ~40 ms
# artificiales a cada mensaje QoS 1 y QoS 2, y la comparacion sale falseada.
# (Este hallazgo merece un parrafo en el capitulo de metodologia.)
set_tcp_nodelay true
