# Solo el servicio de base de datos. Los servidores se agregarán en otro issue.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_postgres:
