services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  coap:
    build:
      context: .
      dockerfile: servers/coap/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5683:5683/udp"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
