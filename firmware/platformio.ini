; Firmware del dispositivo de detección de caídas (ESP32 + MPU6050).
;
; Cuatro entornos sobre el mismo código de detección:
;   http, mqtt, coap  -> modo EXPERIMENTO: un único protocolo, misma política de
;                        reintentos en los tres (comparación justa).
;   operativo         -> modo OPERATIVO: si un protocolo falla, pasa al siguiente
;                        (failover). Para la demo, no para medir.
;
; Compilar/subir uno: barra de abajo de VS Code -> "Default (firmware)" -> elegir
; el entorno; o en terminal: pio run -e mqtt -t upload

[platformio]
default_envs = mqtt

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; La placa usa un CH9102: sin esto el monitor puede dejarla en reinicio.
monitor_rts = 0
monitor_dtr = 0
; time: hora en cada línea; log2file: guarda todo en un .log para el análisis.
monitor_filters = time, log2file
lib_deps =
    256dpi/MQTT @ 2.5.3
build_flags =
    -Wall

[env:http]
build_flags = ${env.build_flags} -D MODE_EXPERIMENT -D EXPERIMENT_PROTOCOL=0

[env:mqtt]
build_flags = ${env.build_flags} -D MODE_EXPERIMENT -D EXPERIMENT_PROTOCOL=1

[env:coap]
build_flags = ${env.build_flags} -D MODE_EXPERIMENT -D EXPERIMENT_PROTOCOL=2

[env:operativo]
build_flags = ${env.build_flags} -D MODE_OPERATIONAL
