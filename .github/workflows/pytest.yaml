name: Pytest

on:
  pull_request:
    branches: [dev, main]

jobs:
  common:
    name: Tests common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar pytest
        run: pip install "$(grep '^pytest==' requirements.txt)"

      - name: Ejecutar tests
        run: pytest common

  servers:
    name: Tests ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [http, coap]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servers/${{ matrix.server }}/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest
