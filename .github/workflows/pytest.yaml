name: Pytest

on:
  pull_request:
    branches: [dev, main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev,http,coap,mqtt]"

      - name: Ejecutar tests
        run: pytest
