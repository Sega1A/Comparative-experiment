name: Ruff

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar Ruff
        run: pip install "$(grep '^ruff==' requirements.txt)"

      - name: ruff check
        run: ruff check .

  format:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar Ruff
        run: pip install "$(grep '^ruff==' requirements.txt)"

      - name: ruff format --check
        run: ruff format --check --exclude "*.md" .
